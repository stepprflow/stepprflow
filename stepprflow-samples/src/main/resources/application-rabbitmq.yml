# RabbitMQ broker configuration
server:
  port: 8011  # Different port to avoid conflict when running both

stepprflow:
  broker: rabbitmq
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # SF-28: overridable via env; the guest/guest fallback is the local-dev
    # RabbitMQ default and must never be used outside a local sample run.
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    exchange: stepprflow.workflows
    prefetch-count: 10
    trusted-packages:
      - io.github.stepprflow.core.model
      - io.github.stepprflow.sample.model