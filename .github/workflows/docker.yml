name: Docker Build & Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'stepprflow-core/**'
      - 'stepprflow-spring-kafka/**'
      - 'stepprflow-spring-rabbitmq/**'
      - 'stepprflow-monitoring/**'
      - 'stepprflow-ui/**'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.github/workflows/docker.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'stepprflow-core/**'
      - 'stepprflow-spring-kafka/**'
      - 'stepprflow-spring-rabbitmq/**'
      - 'stepprflow-monitoring/**'
      - 'stepprflow-ui/**'
      - 'Dockerfile'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to registry'
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stepprflow/stepprflow-monitor

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Set latest tag for main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with branch name
            type=ref,event=branch
            # Tag with PR number
            type=ref,event=pr
            # Tag with git tag (v1.0.0 -> 1.0.0)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Tag with short SHA
            type=sha,prefix=sha-

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && (inputs.push == true || inputs.push == null) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

  # Security scan
  scan:
    name: Security Scan
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    permissions:
      security-events: write
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Test the built image
  test:
    name: Test Docker Image
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kafka:
        image: confluentinc/cp-kafka:7.5.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for Kafka
        run: timeout 90 bash -c 'until nc -z localhost 9092; do sleep 2; done'

      - name: Smoke-test the monitor image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}"
          docker pull "$IMAGE"

          # Boot the monitor against the Mongo + Kafka service containers. A real
          # auth mode is set so it is not fail-closed; reads/mutations still need a
          # role, but /actuator/health is public.
          docker run -d --name stepprflow-test --network host \
            -e MONGODB_URI=mongodb://localhost:27017/stepprflow \
            -e KAFKA_BOOTSTRAP_SERVERS=localhost:9092 \
            -e STEPPRFLOW_MONITOR_AUTH_MODE=basic \
            -e STEPPRFLOW_MONITOR_AUTH_BASIC_USERNAME=admin \
            -e STEPPRFLOW_MONITOR_AUTH_BASIC_PASSWORD=admin \
            -e STEPPRFLOW_MONITOR_AUTH_BASIC_ROLE=OPERATOR \
            "$IMAGE"

          # Poll /actuator/health until UP (startup + Mongo + Kafka), up to ~150s.
          # Gate on the HTTP status, not a substring: /actuator/health returns 200
          # only when the TOP-LEVEL status is UP and 503 when any component
          # (e.g. Mongo) is DOWN. Grepping for '"status":"UP"' would match a
          # healthy sub-component while the overall status is DOWN — a false pass.
          ok=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/actuator/health || true)
            echo "attempt $i: health HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 5
          done

          if [ -z "$ok" ]; then
            echo "::error::monitor health never reached UP (HTTP 200)"
            curl -s http://localhost:8090/actuator/health || true
            echo
            docker logs stepprflow-test | tail -80
            exit 1
          fi

          # The public auth-config endpoint must answer 200.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/api/auth/config)
          echo "GET /api/auth/config -> $code"
          [ "$code" = "200" ] || { docker logs stepprflow-test | tail -80; exit 1; }

          echo "Monitor image smoke test passed."
          docker rm -f stepprflow-test

  # Full end-to-end: a real producer (sample OrderWorkflow) drives the whole
  # chain workflow -> Kafka -> monitor -> Mongo -> monitor API. Unlike the image
  # smoke above (which only proves the monitor boots and serves), this proves an
  # execution is actually ingested and reaches COMPLETED.
  e2e:
    name: End-to-End (samples)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build and start the e2e stack
        run: docker compose -f docker-compose.e2e.yml up --build -d

      - name: Run end-to-end smoke
        run: bash scripts/e2e-check.sh

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  # Update deployment (optional - triggered on release)
  notify:
    name: Notify Release
    needs: [build, scan, test, e2e]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Create summary
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.build.outputs.image-tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull command:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
