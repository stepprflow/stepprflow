server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: stepprflow-dashboard

stepprflow:
  enabled: true
  broker: kafka

  # Disable workflow execution - dashboard only monitors, doesn't execute
  workflow:
    executor:
      enabled: false

  # UI and CORS configuration
  ui:
    enabled: true
    # CORS configuration - by default, same-origin policy applies (secure)
    # Uncomment and configure for development or cross-origin scenarios:
    # cors:
    #   allowed-origins:
    #     - http://localhost:5173  # Vite dev dashboard
    #     - http://localhost:3000  # Alternative dev dashboard
    #   allow-credentials: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    trusted-packages:
      - io.github.stepprflow.core.model
      - io.github.stepprflow.monitor.model
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:stepprflow-dashboard}
      auto-offset-reset: earliest
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
    producer:
      acks: all
      retries: 3

  monitor:
    # MongoDB persistence for the dashboard. The monitor builds its own
    # MongoClient from this property (NOT spring.data.mongodb.uri), so this is
    # the knob that actually configures it. MONGODB_URI is accepted as a
    # convenience alias; the full property name
    # (STEPPRFLOW_MONITOR_MONGODB_URI) wins when both are set.
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/stepprflow}
      database: ${MONGODB_DATABASE:stepprflow}
    retry:
      enabled: true
      poll-interval: 30s
    # Retention/purge of workflow_executions. These keys actually bind to
    # MonitorProperties.Retention (F6: the previous "cleanup.*" keys below
    # did NOT bind to anything and were silently ignored):
    #   retention.enabled        - master on/off switch for the scheduled purge job
    #   retention.max-age        - age (based on updatedAt, falling back to
    #                              createdAt), REGARDLESS OF STATUS, after which an
    #                              execution is purged. Applies to stuck executions
    #                              (IN_PROGRESS/PENDING/RETRY_PENDING) and CANCELLED
    #                              ones too, not just COMPLETED/FAILED (F2/F11).
    #   retention.completed-ttl  - optional override for COMPLETED only (falls
    #                              back to max-age when unset)
    #   retention.failed-ttl     - optional override for FAILED only (falls
    #                              back to max-age when unset)
    #   retention.cleanup-cron   - cron expression for the scheduled purge job
    retention:
      enabled: true
      max-age: 30d
    # SF-5 — authentication for the monitoring API, dashboard and WebSocket.
    # No default is set on purpose: until a mode is chosen the security filter
    # chain denies every request (fail-closed). Pick ONE mode per deployment:
    #
    # auth:
    #   mode: basic            # local login against the user below
    #   basic:
    #     username: admin
    #     password: "{bcrypt}$2a$10$...."   # bcrypt hash; plaintext is accepted but warned
    #     role: OPERATOR       # OPERATOR (can mutate) or VIEWER (read-only)
    #
    # auth:
    #   mode: oidc             # SSO via Keycloak/OIDC (configure the client below)
    #   oidc:
    #     roles-claim: roles
    #     operator-role: stepprflow-operator
    #     viewer-role: stepprflow-viewer
    # For oidc mode also set spring.security.oauth2.client.registration.keycloak.*
    # and spring.security.oauth2.client.provider.keycloak.issuer-uri.

  dashboard:
    title: Steppr Flow Monitoring
    refresh-interval: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false

logging:
  level:
    io.github.stepprflow: ${LOG_LEVEL:INFO}
    org.apache.kafka: WARN
